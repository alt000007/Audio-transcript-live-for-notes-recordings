name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue number to process
        required: true
        type: number
      issue-title:
        description: Issue title
        required: true
        type: string
      issue-body:
        description: Trusted task instructions for Claude
        required: true
        type: string

jobs:
  repository-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify README exists
        run: test -s README.md

  claude-code:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Claude Code GitHub Integration
        uses: nicholaslee119/claude-code-github-action@0.1.1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: issue
          use-bedrock: 'false'
          issue-number: ${{ inputs.issue-number }}
          issue-title: ${{ inputs.issue-title }}
          issue-body: ${{ inputs.issue-body }}